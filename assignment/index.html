<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        * {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #F8FAFC;
            color: #0F172A;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #FFFFFF;
            color: #0F172A;
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid #E2E8F0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: -0.025em;
        }

        header h1 b {
            color: #6366F1;
        }

        .container1, .container2 {
            max-width: 800px;
            width: 90%;
            margin: 0 auto 20px auto;
            padding: 24px;
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
        }

        .titlesoal1, .titlesoal2 {
            color: #0F172A;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .desc1, .desc2 {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .container-output1, .container-output2 {
            margin-top: 16px;
            padding: 14px;
            background-color: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            min-height: 50px;
            font-size: 0.9rem;
            color: #1E293B;
            display: none;
        }

        .menu {
            color: #475569;
            margin-top: 8px;
        }

        .menu li {
            padding: 4px 0;
            border-bottom: 1px dashed #E2E8F0;
        }

        .menu li:last-child {
            border-bottom: none;
        }

        .soal1, .soal2 {
            background-color: #6366F1;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .soal1:hover, .soal2:hover {
            background-color: #4F46E5;
        }

        .cetak {
            background-color: #10B981;
            color: white;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            margin: 20px auto 40px auto;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
            transition: background-color 0.2s;
        }

        .cetak:hover {
            background-color: #059669;
        }

        footer {
            margin-top: auto;
            background-color: #FFFFFF;
            color: #64748B;
            padding: 16px;
            text-align: center;
            border-top: 1px solid #E2E8F0;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>ALL IN ONE <b>THOUGHT</b></h1>
    </header>

    <section class="container1">
        <h2 class="titlesoal1">Soal 1</h2>
        <p class="desc1">Nilai akhir dihitung dari tugas 30%, UTS 30%, dan UAS 40%.</p>
        <button class="soal1" onclick="selesaikanSoal1()">Jalankan Soal 1</button>
        <div class="container-output1" id="output-soal1" aria-live="polite" style="white-space: pre-line;"></div>
    </section>

    <section id="container-soal2" class="container2">
        <h2 class="titlesoal2">Soal 2</h2>
        <div class="desc2">Menu Makanan
            <ul class="menu" style="list-style-type: none; padding-left: 0;">
                <li>Nasi Goreng - Rp 15.000</li>
                <li>Es Teh - Rp 5.000</li>
                <li>Roti - Rp 7.000</li>
            </ul>
        </div>
        <button class="soal2" onclick="jalankanSoal2()">Jalankan Soal 2</button>
        <div class="container-output2" id="output-soal2" aria-live="polite" style="white-space: pre-line;"></div>
    </section>

    <!-- Tombol untuk memicu cetak PDF -->
    <button class="cetak" onclick="cetakKePDF()">
       Cetak Hasil Tugas ke PDF
    </button>

    <script src="tugas.js"></script>

    <footer>
        <p>&copy; 2024 All Rights Reserved.</p>
    </footer>
</body>
</html>
